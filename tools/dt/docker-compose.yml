version: '3.7'

services:
  db:
    image: postgres:15
    container_name: dtrack-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=dtrack
      - POSTGRES_PASSWORD=dtrack_password
      - POSTGRES_DB=dtrack
    volumes:
      - dtrack_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  apiserver:
    image: dependencytrack/apiserver:latest
    container_name: dtrack-apiserver
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - dtrack_data:/data
    environment:
      - ALPINE_DATABASE_MODE=external
      - ALPINE_DATABASE_URL=jdbc:postgresql://db:5432/dtrack
      - ALPINE_DATABASE_DRIVER=org.postgresql.Driver
      - ALPINE_DATABASE_USERNAME=dtrack
      - ALPINE_DATABASE_PASSWORD=dtrack_password

  frontend:
    image: dependencytrack/frontend:latest
    container_name: dtrack-frontend
    depends_on:
      - apiserver
    ports:
      - "8080:8080"
    environment:
      - API_BASE_URL=http://localhost:8081
    restart: unless-stopped

volumes:
  dtrack_data:
  dtrack_db_data:
