name: Deploy to AWS ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: 'us-east-1' # Change to your preferred region
  ECR_REPOSITORY: 'expense-portal-backend'
  NETWORK_STACK_NAME: 'expense-network-stack'
  DATABASE_STACK_NAME: 'expense-database-stack'
  ECS_SERVICE_STACK_NAME: 'ecs-service-stack'

permissions:
  id-token: write # Required for OIDC authentication
  contents: read

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_IAM_ROLE_NAME }} # Assumes you have an OIDC role
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy Network CloudFormation stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.NETWORK_STACK_NAME }}
          template: .aws/network.yml
          no-fail-on-empty-changeset: "1"
          capabilities: "CAPABILITY_IAM,CAPABILITY_NAMED_IAM"

      - name: Deploy Database CloudFormation stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.DATABASE_STACK_NAME }}
          template: .aws/database.yml
          no-fail-on-empty-changeset: "1"
          capabilities: "CAPABILITY_IAM,CAPABILITY_NAMED_IAM"
          parameter-overrides: "NetworkStackName=${{ env.NETWORK_STACK_NAME }}"

      - name: Deploy ECS Service CloudFormation stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.ECS_SERVICE_STACK_NAME }}
          template: .aws/ecs-service.yml
          no-fail-on-empty-changeset: "1"
          capabilities: "CAPABILITY_IAM,CAPABILITY_NAMED_IAM"
          parameter-overrides: "NetworkStackName=${{ env.NETWORK_STACK_NAME }},DatabaseStackName=${{ env.DATABASE_STACK_NAME }},ImageURI=${{ steps.build-image.outputs.image_uri }},JwtSecret=${{ secrets.JWT_SECRET }},S3BucketName="
